<title>The Birthday Kingdom</title>
<style>

:root{--pk:#ffb3d1;--lv:#c9b6ff;--cr:#fff6e5;--bl:#bfe3ff;--gd:#ffd36b;--ink:#5b3a63}

.btn{border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:700;background:linear-gradient(#fff,var(--pk));color:var(--ink);box-shadow:0 4px 0 #d98aae,0 8px 18px #0003;cursor:pointer;min-height:44px;margin:4px}
.btn:active{transform:translateY(2px)}.btn.sm{padding:6px 12px;min-height:40px}
#hud{position:fixed;top:8px;left:8px;right:8px;display:none;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto;margin:0}
.pill{background:#fffc;border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px;box-shadow:0 2px 10px #0002}
#nxt{display:none;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#dlg{position:fixed;left:50%;top:92px;transform:translateX(-50%);width:min(660px,94vw);background:#fffaf0;border:3px solid var(--pk);border-radius:20px;padding:12px 18px;display:none;box-shadow:0 8px 30px #0005;z-index:4;font-size:16px;line-height:1.45;cursor:pointer}
#dlg small{opacity:.55;display:block;text-align:right}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#fffaf0;border-radius:999px;padding:8px 18px;font-weight:700;display:none;z-index:6;box-shadow:0 4px 16px #0004}
#ctl{position:fixed;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:3}
#ctl>*{pointer-events:auto}
.dp{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dp button{border:0;border-radius:16px;background:#fffb;font-size:22px;color:var(--ink);box-shadow:0 3px 10px #0003}
#act{width:84px;height:84px;border-radius:50%;border:0;font-size:30px;background:linear-gradient(#fff,var(--gd));box-shadow:0 4px 0 #d9a93a,0 8px 18px #0004}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#2a1b3dbb;z-index:5;padding:10px;overflow:auto}
.card{background:#fffaf0;border-radius:24px;padding:20px;width:min(560px,96vw);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 10px 40px #0006;border:3px solid var(--pk);animation:pop .35s;position:relative;touch-action:pan-y}
.card h1,.card h2{margin:.2em 0 .4em}.msg{line-height:1.6;font-size:16px}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
h1.t{font-size:clamp(28px,7vw,46px);margin:.1em 0}
h1.t span{display:inline-block;animation:bob 2s ease-in-out infinite;background:linear-gradient(#ff7eb6,#8c6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.gf{font-size:80px;animation:shake .5s 2}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .6s;z-index:9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:auto}
.mc{aspect-ratio:1;font-size:30px;border:0;border-radius:14px;background:var(--lv);cursor:pointer}.mc.on{background:#fff;box-shadow:inset 0 0 0 3px var(--pk)}
.col{display:flex;flex-direction:column}
.cs{position:absolute;width:42px;height:42px;border-radius:50%;border:0;background:var(--gd);font-weight:800;color:var(--ink);box-shadow:0 0 14px #ffe9a0;font-size:16px}
.it{display:flex;gap:10px;text-align:left;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;align-items:flex-start}.it b{display:block}
.fl{font-size:34px;cursor:pointer;background:none;border:0}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span class="pill" id="h1"></span><span class="pill" id="h2"></span><span class="pill" id="h4"></span><button class="btn sm" id="nxt">Next Chapter ➜</button><span class="pill" id="h3" style="flex-basis:100%"></span>
<span style="margin-left:auto"></span><button class="btn sm" id="jb" aria-label="Journal">📖</button><button class="btn sm" id="snd" aria-label="Sound">🔊</button><button class="btn sm" id="mn" aria-label="Menu">☰</button></div>

<script>
"use strict";
const $=s=>document.querySelector(s),R=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C=$('#c'),X=C.getContext('2d');let W=0,H=0,T=0,run=false,ovC=false,mg=0,mgid=0,fw=0,ac=null,mus=null,K={},dq=[],dcb=null,mv=false,tt=0;
const KEY='birthdayKingdomSara_v1';
const fresh=()=>({ch:0,max:0,f:{},items:[],stars:0,hearts:0,snd:1});
let S=fresh(),p={x:.5,y:.8,f:1},lu={x:.45,y:.72},pt=[];
function load(){try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*d;C.height=H*d;X.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const kk=()=>clamp(Math.min(W,H*1.6)/640,.65,1.15);
/* ---------- audio ---------- */
function au(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){ac=null}}
function tone(f,d,ty,v){if(!S.snd)return;au();if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.07,n);g.gain.exponentialRampToValueAtTime(.0001,n+(d||.15));o.connect(g);g.connect(ac.destination);o.start();o.stop(n+(d||.15))}catch(e){}}
function sfx(k){[523,659,784,1047].slice(0,k||3).forEach((f,i)=>setTimeout(()=>tone(f,.25),i*90))}
function music(){clearInterval(mus);const P=[262,294,330,392,440,523];mus=setInterval(()=>{if(S.snd&&ac&&!document.hidden)tone(P[Math.floor(R()*6)]/(R()<.5?1:2),.9,'triangle',.025)},700)}
/* ---------- story text ---------- */
const M1=`Sara, this is the first spark of magic. Every star you collect brings a little more magic back to your world, and you just brought back the first one. You make ordinary days feel softer and brighter. Happy Birthday.`;
const M2=`Every heart you caught today is a small thank-you for the warmth you carry around. I hope this birthday catches you in as much joy as you give to other people.`;
const M3=`Memories are made of small things: laughter, kindness, and the way someone makes a room feel calmer. Yours is the kind of company that is easy to remember and hard to forget.`;
const M4=`To Sara, under the moon.<br>If I could pick one thing for the sky to say tonight, it would be this: you are precious, you are appreciated, and you deserve every good thing that comes your way. This adventure was created with love, just for you.<br>With love, Muhib`;
const LETTER=`Dear Sara,<br><br>Happy Birthday. Today, the whole kingdom celebrates you.<br><br>I made this little adventure because I wanted you to have something as warm as you are: a place with gentle music, quiet stars and small surprises waiting along the way.<br><br>You are precious and you are appreciated. You deserve good days, soft moments, big laughs and every bit of happiness this year can hold. Whenever things feel heavy, I hope you remember that you are cared about, and that your kindness really is noticed.<br><br>May the year ahead be full of light, and may you always carry a little magic in your pocket.<br><br>With love,<br>Muhib 💖`;
const INTRO=[
[['Lumi','Welcome to your little kingdom, Sara. I\'m Lumi, a tiny spark of birthday magic.'],['Lumi','The kingdom has lost its birthday magic. To bring it back, you will explore five chapters, play a few games and collect magical stars.'],['Lumi','Move with WASD or the arrow keys (or the on-screen pad). Walk up to sparkling things and press Space, Enter or the ✋ button. Esc opens the menu.'],['Lumi','Let\'s start: find the glowing star in the garden, then open the gift chest. 🌟']],
[['Lumi','The Festival Village! Lanterns, flowers and a stage that is waiting for you.'],['Lumi','Try the festival stage 🎪. Some hearts and stars need catching.']],
[['Lumi','The Memory Forest glows when someone special walks through it.'],['Lumi','Visit the great tree 🌳 and match the memory cards. Glowing things in the forest hide little hearts too.']],
[['Lumi','The Moonlit Lake. Listen, it is so quiet and the water is full of stars.'],['Lumi','Walk to the star altar 🌠 and draw the constellation, one star at a time.']],
[['Lumi','The Birthday Castle! It was all built for you, Sara.'],['Lumi','Open the castle gate 🏰. Once you are inside, there is a cake waiting. 🎂']]];
const OBJ=['Find the star ⭐ and open the chest 🎁','Play the festival game at the stage 🎪','Match the cards at the great tree 🌳','Connect the stars at the altar 🌠','Enter the castle, then light up the cake 🎂'];
const CH=[
{n:'The Little Cottage',sk:['#ffd6e8','#e9dcff'],gr:['#c8f0b8','#92d68f'],
 dc:[['🌳',.1,.5,80],['🌳',.93,.55,86],['🌸',.32,.8,32],['🌷',.66,.88,34],['🌼',.9,.78,30],['🌷',.05,.82,30],['🦋',.6,.62,24],['☁️',.2,.1,70],['☁️',.7,.16,60]],
 o:[['cot','🏡',.5,.54,'Cottage',110],['star','⭐',.84,.62,'Glowing star',50],['chest','🎁',.2,.72,'Locked gift chest',58]]},
{n:'The Festival Village',sk:['#ffe3b8','#ffc2dc'],gr:['#ffe9b0','#f2c98a'],
 dc:[['🏠',.1,.52,90],['🏡',.88,.52,90],['🎈',.3,.2,40],['🎈',.7,.24,40],['🏮',.45,.12,36],['🏮',.58,.14,36],['🌺',.3,.84,30],['🌻',.78,.88,34],['🎊',.15,.12,40]],
 o:[['stage','🎪',.5,.56,'Festival stage',110],['npc1','🧚',.25,.74,'Villager',54],['lant','🏮',.82,.7,'Lantern',48]]},
{n:'The Memory Forest',sk:['#2a1f5e','#6a4ba0'],gr:['#2f6f5c','#1d4a42'],
 dc:[['🌲',.08,.52,90],['🌲',.92,.52,90],['🌲',.22,.5,70],['🌲',.78,.5,74],['🍄',.35,.85,30],['🍄',.7,.9,28],['🌿',.55,.82,28]],
 o:[['tree','🌳',.5,.56,'Memory Tree',120],['mush','🍄',.15,.76,'Glowing mushroom',48],['ff','✨',.86,.66,'Hidden sparkle',44]]},
{n:'The Moonlit Lake',sk:['#101a4a','#3a3a8a'],gr:['#2c4a8a','#14234f'],
 dc:[['🌙',.78,.12,50],['🌲',.06,.5,80],['🌲',.95,.5,80],['🪷',.3,.7,34],['🪷',.72,.82,30]],
 o:[['alt','🌠',.5,.6,'Star altar',70],['boat','⛵',.18,.7,'Little boat',52]]},
{n:'The Birthday Castle',sk:['#2b1f5c','#ff9ec9'],gr:['#dcc8ff','#b79df0'],
 dc:[['🎆',.15,.12,54],['🎇',.85,.14,54],['🎈',.1,.6,44],['🎈',.92,.64,44],['🌹',.3,.88,30],['🌹',.7,.88,30],['⭐',.5,.08,40]],
 o:[['door','🏰',.5,.54,'Castle gate',130],['cake','🎂',.5,.76,'Birthday cake',66],['guard','🧸',.2,.72,'Royal teddy',54]]}];
const GF={stage:'catch',tree:'match',alt:'const',door:'in',cake:'fin'};
const DONE=[f=>f.star&&f.chest,f=>f.catch,f=>f.match,f=>f.const,f=>f.fin];
/* ---------- UI helpers ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',1700)}
function ov(h,close){const o=$('#ov');stopMg();fw=0;o.innerHTML=h;o.style.display='flex';ovC=close!==false&&run}
function cl(){stopMg();fw=0;const o=$('#ov');o.style.display='none';o.innerHTML=''}
function stopMg(){mg=0}
function say(l,cb){dq=l.slice();dcb=cb||null;nx()}
function nx(){const d=$('#dlg');if(!dq.length){d.style.display='none';const c=dcb;dcb=null;if(c)c();return}const a=dq.shift();d.innerHTML=`<b>${a[0]}</b><div>${a[1]}</div><small>▶ tap / Space</small>`;d.style.display='block';tone(740,.05)}
const busy=()=>$('#dlg').style.display==='block'||$('#ov').style.display==='flex';
function hud(){const f=S.f;$('#h1').textContent=`Chapter ${S.ch+1}: ${CH[S.ch].n}`;$('#h2').textContent=`⭐ ${S.stars}  💗 ${S.hearts}  🎁 ${S.items.length}`;$('#h3').textContent='🎯 '+OBJ[S.ch];$('#h4').textContent=DONE.map(d=>d(f)?'●':'○').join(' ');$('#snd').textContent=S.snd?'🔊':'🔇';$('#nxt').style.display=DONE[S.ch](f)&&S.ch<4?'inline-block':'none'}
function chk(){save();hud()}
function gift(i,t,m){sfx(4);if(!S.items.some(x=>x.t===t))S.items.push({i,t,m});chk();ov(`<div class="card"><div class="gf">🎁</div><h2 id="gt">Opening…</h2></div>`,false);setTimeout(()=>{if(!$('#gt'))return;ov(`<div class="card"><div class="gf">${i}</div><h2>${t}</h2><p class="msg">${m}</p><button class="btn" onclick="cl()">Keep it ✨</button></div>`);sfx(4)},1100)}
function doneCard(t){ov(`<div class="card"><h2>🎉 ${t}</h2><button class="btn" onclick="cl()">Back to the kingdom</button></div>`)}
function go(i){$('#fade').style.opacity=1;setTimeout(()=>{S.ch=clamp(i,0,4);S.max=Math.max(S.max,S.ch);p.x=.5;p.y=.82;lu.x=.45;lu.y=.74;cl();dq=[];$('#dlg').style.display='none';chk();$('#fade').style.opacity=0;setTimeout(()=>say(INTRO[S.ch]),300)},650)}
/* ---------- menus ---------- */
function menu(){ov(`<div class="card"><h2>⏸ Paused</h2><div class="col"><button class="btn" onclick="cl()">▶ Resume</button><button class="btn" onclick="journal()">📖 Journal</button><button class="btn" onclick="chapters()">🗺️ Chapters</button><button class="btn" onclick="help()">❓ How to play</button><button class="btn" onclick="tog()">${S.snd?'🔊 Sound: On':'🔇 Sound: Off'}</button><button class="btn" onclick="rst()">🗑 Reset progress</button></div></div>`)}
function tog(){S.snd=S.snd?0:1;save();hud();au();menu()}
function journal(back){const l=S.items.length?S.items.map(x=>`<div class="it"><span style="font-size:30px">${x.i}</span><div><b>${x.t}</b>${x.m}</div></div>`).join(''):'<p>Nothing collected yet. Play the chapters to unlock gifts and memories.</p>';ov(`<div class="card"><h2>📖 Journal</h2><p>⭐ ${S.stars} stars · 💗 ${S.hearts} hearts</p>${l}<button class="btn" onclick="${back?'finale()':'menu()'}">Back</button></div>`)}
function chapters(){ov(`<div class="card"><h2>🗺️ Chapters</h2><div class="col">${CH.map((c,i)=>i<=S.max?`<button class="btn" onclick="go(${i})">${i+1}. ${c.n}${DONE[i](S.f)?' ✔':''}</button>`:`<button class="btn" disabled style="opacity:.5">${i+1}. 🔒 Locked</button>`).join('')}<button class="btn" onclick="menu()">Back</button></div></div>`)}
function help(){ov(`<div class="card"><h2>❓ How to play</h2><p class="msg" style="text-align:left">🖥 <b>Desktop:</b> WASD or arrow keys to move, Space/Enter or a click to interact, Esc for the menu.<br>📱 <b>Mobile:</b> use the on-screen pad and the ✋ button.<br>✨ Walk up to glowing things to interact. Each chapter has one objective (shown at the top). Finish it, then press <b>Next Chapter</b>.<br>💾 Progress saves automatically. Sound is optional.</p><button class="btn" onclick="${run?'menu()':'title()'}">Back</button></div>`,run)}
function rst(){ov(`<div class="card"><h2>Reset all progress?</h2><p>This clears your stars, gifts and chapters.</p><button class="btn" id="ry">Yes, reset</button><button class="btn" onclick="menu()">No, go back</button></div>`);$('#ry').onclick=()=>{S=fresh();save();run=false;$('#hud').style.display=$('#ctl').style.display='none';title()}}
function title(){run=false;const has=!!load();ov(`<div class="card" style="background:#fffaf0ee"><div style="font-size:46px">👑</div><h1 class="t">${'The Birthday Kingdom'.split('').map((c,i)=>`<span style="animation-delay:${i*.09}s">${c===' '?'&nbsp;':c}</span>`).join('')}</h1><p>A magical birthday adventure made with love by Muhib for Sara.</p><div class="col"><button class="btn" id="st">✨ Start Adventure</button>${has?'<button class="btn" id="co">▶ Continue</button>':''}<button class="btn" onclick="help()">❓ Help</button></div></div>`,false);
$('#st').onclick=()=>begin(fresh());const c=$('#co');if(c)c.onclick=()=>begin(Object.assign(fresh(),load()))}
function begin(s){S=s;au();music();run=true;$('#hud').style.display='flex';$('#ctl').style.display='flex';cl();hud();go(S.ch)}
/* ---------- interactions ---------- */
const objs=()=>CH[S.ch].o.filter(o=>o[0]!=='cake'||S.f.in).map(o=>({id:o[0],e:o[1],x:o[2],y:o[3],t:o[4],s:o[5]}));
function near(){let b=null,bd=1e9;for(const o of objs()){const d=Math.hypot((o.x-p.x)*W,(o.y-p.y)*H);if(d<100*kk()&&d<bd){b=o;bd=d}}return b}
function act(){if(!run||busy())return;const o=near();if(o)doObj(o);else toast('Walk up to something sparkling ✨')}
function heart(id,msg){if(S.f[id])return toast('Already found 💗');S.f[id]=1;S.hearts++;sfx(2);chk();toast(msg)}
function doObj(o){const f=S.f;tone(600,.08);switch(o.id){
case 'cot':say([['Lumi','Your little cottage. It always smells of warm cake and sunshine here.'],['Lumi','Find the glowing star in the garden, then open the gift chest!']]);break;
case 'star':if(f.star)toast('Already collected ⭐');else{f.star=1;S.stars++;sfx();chk();say([['Lumi','You found it! Every star you collect brings a little more magic back to your world.'],['Lumi','The gift chest should open now.']])}break;
case 'chest':if(!f.star)say([['Lumi','The chest is locked. It hums when a star is near…']]);else if(f.chest)toast('Already opened 🎁');else{f.chest=1;gift('💌','First Note from Muhib',M1)}break;
case 'stage':catchGame();break;
case 'npc1':say([['Villager','Happy Birthday, Sara! The whole village is celebrating you today.'],['Villager','The stage is ready whenever you are.']]);break;
case 'lant':heart('lant','A lantern gave you a heart 💗');break;
case 'tree':matchGame();break;
case 'mush':heart('mush','A glowing mushroom gave you a heart 💗');break;
case 'ff':heart('ff','The fireflies left you a heart 💗');break;
case 'alt':conGame();break;
case 'boat':say([['Lumi','A little boat that drifts under the stars. It is just for looking, but it is lovely, isn\'t it?']]);break;
case 'door':{const m=[];if(!f.chest)m.push('the cottage chest');if(!f.catch)m.push('the festival game');if(!f.match)m.push('the memory cards');if(!f.const)m.push('the constellation');
 if(m.length)say([['Lumi','The gate stays closed until the earlier magic returns. Still missing: '+m.join(', ')+'. You can revisit chapters from the menu.']]);else if(f.in)toast('Already open. Try the cake 🎂');else{f.in=1;sfx(4);chk();say([['Lumi','The gates swing open, just for you, Sara.'],['Lumi','Walk to the birthday cake 🎂 and blow out the candles.']])}break}
case 'cake':candles();break;
case 'guard':say([['Royal Teddy','Welcome, Your Highness! Today the whole kingdom celebrates you.']]);break}}
function catchGame(){ov(`<div class="card"><h2>🎪 Festival Sky</h2><p>Catch <b>10</b> falling hearts and stars. Use ◀ ▶ or drag your finger.</p><canvas id="cg" width="320" height="380" style="max-width:100%;border-radius:16px;background:linear-gradient(#ffd6e8,#e9dcff);touch-action:none"></canvas><p id="cs">0 / 10</p><button class="btn" id="cx">Leave game</button></div>`);
const cv=$('#cg'),g=cv.getContext('2d'),id=mg=++mgid;let bx=160,sc=0,it=[],last=performance.now();
const mm=e=>{const r=cv.getBoundingClientRect();bx=(e.clientX-r.left)/r.width*320};cv.onpointermove=mm;cv.onpointerdown=mm;$('#cx').onclick=cl;
(function L(now){if(mg!==id)return;requestAnimationFrame(L);const dt=Math.min((now-last)/1000,.05);last=now;
if(K.arrowleft||K.a)bx-=280*dt;if(K.arrowright||K.d)bx+=280*dt;bx=clamp(bx,25,295);
if(R()<dt*2.4)it.push({x:20+R()*280,y:-20,e:R()<.7?'💗':'⭐',v:100+R()*70});
it.forEach(o=>o.y+=o.v*dt);
it=it.filter(o=>{if(o.y>325&&o.y<370&&Math.abs(o.x-bx)<38){sc++;tone(600+sc*45,.12);$('#cs').textContent=sc+' / 10';return false}return o.y<400});
g.clearRect(0,0,320,380);g.font='28px serif';g.textAlign='center';g.textBaseline='middle';it.forEach(o=>g.fillText(o.e,o.x,o.y));g.font='44px serif';g.fillText('🧺',bx,350);
if(sc>=10){mg=0;const first=!S.f.catch;S.f.catch=1;if(first){S.hearts+=3;gift('🎀','Festival Memory',M2)}else{chk();doneCard('You caught them all!')}}})(performance.now())}
